name: Build Kernel for Xiaomi Mi Pad 4 (clover) + Baka-SU + SUSFS inline-hook + AnyKernel3

"on":
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: "Kernel branch to build"
        required: true
        default: "16.0"
      defconfig_path:
        description: "Path/name of defconfig (relative to kernel root)"
        required: true
        default: "clover_defconfig"
      bakasu_tag:
        description: "Baka-SU tag/ref (留空使用 main 分支最新提交)"
        required: false
        default: ""
      clang_repo:
        description: "Clang 仓库 (owner/repo)。sdm660 是 4.4 内核，不能用 clang 16+"
        required: true
        default: "LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b"
      clang_branch:
        description: "Clang 仓库分支"
        required: true
        default: "lineage-20.0"

env:
  KERNEL_REPO: "crdroidandroid/android_kernel_xiaomi_sdm660"
  ARCH: arm64
  SUBARCH: arm64
  CCACHE_DIR: /home/runner/.cache/ccache-kernel
  CLANG_REPO: ${{ github.event.inputs.clang_repo }}
  CLANG_BRANCH: ${{ github.event.inputs.clang_branch }}
  BAKASU_REPO: "https://github.com/Baka-SU/BakaSU.git"
  KERNEL_BRANCH: ${{ github.event.inputs.kernel_branch }}
  DEFCONFIG_PATH: ${{ github.event.inputs.defconfig_path }}
  BAKASU_TAG_INPUT: ${{ github.event.inputs.bakasu_tag }}

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      # ============ 1. 拉取本仓库 ============
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          path: builder

      # ============ 2. 拉取内核源码（sdm660 / Linux 4.4）============
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNEL_REPO }}
          ref: ${{ env.KERNEL_BRANCH }}
          path: kernel
          fetch-depth: 1

      # ============ 3. 安装编译依赖 ============
      - name: Install build dependencies
        run: bash "$GITHUB_WORKSPACE/builder/scripts/00-install-deps.sh"

      # ============ 4. ccache 缓存 ============
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/ccache-kernel
          key: ${{ runner.os }}-kernel-ccache-${{ env.KERNEL_BRANCH }}-${{ env.CLANG_BRANCH }}-bakasu-dwarf4-${{ hashFiles('kernel/Makefile') }}
          restore-keys: |
            ${{ runner.os }}-kernel-ccache-${{ env.KERNEL_BRANCH }}-${{ env.CLANG_BRANCH }}-bakasu-dwarf4-
            ${{ runner.os }}-kernel-ccache-${{ env.KERNEL_BRANCH }}-${{ env.CLANG_BRANCH }}-
            ${{ runner.os }}-kernel-ccache-${{ env.KERNEL_BRANCH }}-

      - name: Setup ccache environment
        run: bash "$GITHUB_WORKSPACE/builder/scripts/01-setup-ccache.sh"

      # ============ 5. 下载 clang（4.4 内核用 clang-r416183b）============
      - name: Setup clang toolchain
        run: bash "$GITHUB_WORKSPACE/builder/scripts/02-setup-clang.sh"

      # ============ 6. 下载 arm64 / 32 位兼容 GCC 4.9 工具链 ============
      - name: Clone arm64 and compat GCC 4.9 toolchains
        run: bash "$GITHUB_WORKSPACE/builder/scripts/03-setup-gcc.sh"

      # ============ 7. 验证工具链 ============
      - name: Verify toolchain
        run: bash "$GITHUB_WORKSPACE/builder/scripts/04-verify-toolchain.sh"

      # ============ 8. 配置内核 ============
      - name: Configure kernel
        working-directory: ./kernel
        run: bash "$GITHUB_WORKSPACE/builder/scripts/05-configure-kernel.sh"

      # ============ 8.5 应用 Droidspaces non-GKI 补丁 ============
      - name: Apply Droidspaces non-GKI patches
        working-directory: ./kernel
        run: bash "$GITHUB_WORKSPACE/builder/scripts/06-apply-droidspaces-patches.sh"

      # ============ 8.6 移除内核自带的旧版 KernelSU ============
      # 该内核树自带老 KernelSU（manual hook），必须先整块拆掉，
      # 否则 SUSFS inline hook 注入不完整且 Baka-SU 的 hook 检查会直接报错。
      - name: Strip legacy in-tree KernelSU
        working-directory: ./kernel
        run: bash "$GITHUB_WORKSPACE/builder/scripts/06-strip-legacy-kernelsu.sh"

      # ============ 8.7 集成 Baka-SU 源码 ============
      - name: Integrate Baka-SU into kernel source
        working-directory: ./kernel
        run: bash "$GITHUB_WORKSPACE/builder/scripts/07-integrate-bakasu.sh"

      # ============ 8.8 应用 SUSFS Linux 4.4 移植补丁 ============
      - name: Apply SUSFS 4.4 patch
        working-directory: ./kernel
        run: bash "$GITHUB_WORKSPACE/builder/scripts/08-apply-susfs-4.4-patch.sh"

      # ============ 8.9 应用 SUSFS inline hooks ============
      - name: Apply SUSFS inline hooks
        working-directory: ./kernel
        run: bash "$GITHUB_WORKSPACE/builder/scripts/08-apply-susfs-inline-hooks.sh"

      # ============ 8.10 启用 Baka-SU + SUSFS inline-hook 配置 ============
      - name: Enable Baka-SU SUSFS inline-hook config
        working-directory: ./kernel
        run: bash "$GITHUB_WORKSPACE/builder/scripts/09-enable-bakasu-config.sh"

      # ============ 9. 确保不编译 DTBO overlay（本机型用 appended DTB）============
      - name: Ensure DTBO overlay compilation is disabled
        working-directory: ./kernel
        run: bash "$GITHUB_WORKSPACE/builder/scripts/10-disable-dtbo.sh"

      # ============ 10. 编译内核 ============
      - name: Build kernel
        working-directory: ./kernel
        run: bash "$GITHUB_WORKSPACE/builder/scripts/11-build-kernel.sh"

      # ============ 10.5 ccache 统计 ============
      - name: Show ccache stats after build
        if: always()
        run: bash "$GITHUB_WORKSPACE/builder/scripts/12-show-ccache-stats.sh"

      # ============ 11. 准备 AnyKernel3 ============
      - name: Setup AnyKernel3
        run: bash "$GITHUB_WORKSPACE/builder/scripts/13-setup-anykernel3.sh"

      # ============ 12. 放入新内核 / DTB / 模块 ============
      - name: Copy kernel into AnyKernel3
        working-directory: ./kernel
        run: bash "$GITHUB_WORKSPACE/builder/scripts/14-copy-kernel.sh"

      # ============ 13. 打包 AnyKernel3 zip ============
      - name: Create AnyKernel3 zip
        run: bash "$GITHUB_WORKSPACE/builder/scripts/15-package-anykernel3.sh"

      # ============ 13.5 下载 Baka-SU Manager APK ============
      # Manager APK 必须与内核里集成的 Baka-SU commit 一致：脚本读取 8.7 步骤写下的
      # /tmp/bakasu_commit.txt，去 Baka-SU 的 Build Manager 工作流产物里找同一 commit 的
      # Manager-release。找不到就跳过（manager_found=false），不影响内核产物。
      # 下载 Actions 产物需要认证（匿名请求 401），所以这里传 GITHUB_TOKEN。
      - name: Download Baka-SU Manager APK
        id: manager
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/builder/scripts/16-download-bakasu-manager.sh"
        env:
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ============ 14. 上传 AnyKernel3 zip ============
      - name: Upload AnyKernel3 zip
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: boot-clover-bakasu-susfs-anykernel-${{ github.run_number }}
          path: ${{ github.workspace }}/boot-clover-bakasu-susfs-*-anykernel-${{ github.run_number }}.zip
          retention-days: 7

      # ============ 14.5 上传 Baka-SU Manager APK ============
      - name: Upload Baka-SU Manager APK
        if: steps.manager.outputs.manager_found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bakasu-manager-${{ github.run_number }}
          path: ${{ github.workspace }}/bakasu-manager/*.apk
          retention-days: 7

      # ============ 15. 上传日志 ============
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: kernel/build.log
          retention-days: 7
